# Martelo FC no Fly.io (região São Paulo).
# Troque "app" por um nome livre antes do primeiro deploy (fly apps create <nome>).
#
# Uma máquina só: as salas vivem na memória do processo e o banco é um arquivo SQLite no volume.
# Por isso o deploy é feito com --ha=false e a máquina nunca é desligada por ociosidade.

app = "martelo-fc"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DATABASE_PATH = "/data/martelo.db"
  LOG_LEVEL = "info"

[[mounts]]
  source = "martelo_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
